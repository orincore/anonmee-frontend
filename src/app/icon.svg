<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Hard offset sticker shadow -->
  <rect x="6" y="6" width="54" height="54" rx="13" fill="#14111c"/>
  <!-- Cobalt badge body -->
  <rect x="4" y="4" width="54" height="54" rx="13" fill="#3b4bff" stroke="#14111c" stroke-width="2.5"/>
  <!-- anon wordmark -->
  <text x="31" y="27" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#f4f3fa" letter-spacing="-0.8">anon</text>
  <!-- mee sticker -->
  <g transform="rotate(-3 31 42)">
    <rect x="12" y="34.5" width="38" height="18" rx="5" fill="#14111c"/>
    <rect x="10.5" y="33" width="38" height="18" rx="5" fill="#ffa07e" stroke="#14111c" stroke-width="2"/>
    <text x="29.5" y="46" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#14111c" letter-spacing="-0.4">mee</text>
  </g>
</svg>